<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEO Chat Assistant</title>
<link rel="stylesheet" href="/static/style.css?v=3">
<style>
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  .chat { flex: 1; overflow-y: auto; }
  .messages { max-width: 820px; margin: 0 auto; padding: 24px 24px 12px; display: flex; flex-direction: column; gap: 14px; }
  @media (max-width: 600px) { .messages { padding: 16px; } }

  .msg { max-width: 85%; padding: 11px 15px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--green); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.error { align-self: flex-start; background: #fde4df; color: var(--red); }
  .msg.log { align-self: stretch; max-width: 100%; background: #1e1e1e; color: #d4d4d4;
             font: 12px/1.5 Consolas, monospace; max-height: 260px; overflow: auto; }
  .typing { color: var(--muted); font-style: italic; }

  .confirm { display: flex; gap: 8px; margin-top: 10px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); padding: 8px 14px; border-radius: 8px; cursor: pointer; }
  button.primary { background: var(--green); border-color: var(--green); color: #fff; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  .welcome { text-align: center; color: var(--muted); padding: 30px 0 10px; }
  .welcome h1 { color: var(--text); font-size: 24px; margin: 0 0 6px; }
  .demo-note { background: var(--green-soft); color: var(--green-dark); border-radius: 10px; padding: 10px 14px; max-width: 560px; margin: 14px auto 0; font-size: 14px; }

  .composer { background: var(--card); border-top: 1px solid var(--line); }
  .composer-inner { max-width: 820px; margin: 0 auto; padding: 12px 24px 16px; }
  @media (max-width: 600px) { .composer-inner { padding: 10px 16px 14px; } }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .chips button { font-size: 13px; padding: 6px 12px; border-radius: 20px; color: var(--green-dark); background: var(--green-soft); border-color: transparent; }
  form { display: flex; gap: 8px; }
  textarea { flex: 1; resize: none; font: inherit; padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px; height: 46px; max-height: 140px; }
  textarea:focus { outline: 2px solid var(--green-soft); border-color: var(--green); }
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <a class="brand" href="/"><span class="brand-mark">S</span><span class="brand-text">SEO Generator</span></a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/guide">Guide</a>
      <a href="/audit">Audit</a>
      <a href="/chat" class="active">Chat</a>
      <a href="/review">Review</a>
    </div>
  </div>
</nav>
<script src="/static/nav.js?v=4"></script>

<div class="chat" id="chat">
  <div class="messages" id="messages">
    <div class="welcome">
      <h1>SEO Chat Assistant</h1>
      <p>Ask me about your products, or tell me what to do.<br>
         I can write SEO for products and collections, alt text for images,
         check for guesses, approve items and publish to Shopify.</p>
    </div>
  </div>
</div>

<div class="composer">
  <div class="composer-inner">
    <div class="chips" id="chips">
      <button>What's the status of everything?</button>
      <button>Generate SEO for 3 products</button>
      <button>Check my products for guesses</button>
      <button>Write alt text for 3 product images</button>
      <button>Audit my store</button>
      <button>Do a dry run push of approved products</button>
    </div>
    <form id="form">
      <textarea id="input" placeholder="Type a message… (Enter to send, Shift+Enter for a new line)" rows="1"></textarea>
      <button class="primary" id="send">Send</button>
    </form>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const chatHistory = [];   // conversation sent to the AI: [{role, content}]
let busy = false;

function addMessage(kind, text) {
  const div = document.createElement("div");
  div.className = "msg " + kind;
  div.textContent = text;   // textContent = safe, never runs HTML
  $("#messages").append(div);
  $("#chat").scrollTop = $("#chat").scrollHeight;
  return div;
}

function setBusy(b) {
  busy = b;
  $("#send").disabled = b;
  document.querySelectorAll("#chips button").forEach(btn => (btn.disabled = b));
}

async function post(path, body) {
  const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || res.statusText);
  return data;
}

// Show a live log box while a generate/push job runs
async function watchJob() {
  const box = addMessage("log", "Starting…");
  while (true) {
    const job = await (await fetch("/api/job")).json();
    box.textContent = job.log.join("\n") || "Starting…";
    box.scrollTop = box.scrollHeight;
    $("#chat").scrollTop = $("#chat").scrollHeight;
    if (!job.running) {
      const last = job.log[job.log.length - 1] || "Finished.";
      const tip = ["push", "undo"].includes(job.kind) ? "" :
        job.kind === "audit" ? "\nOpen the Audit page to see the full report." :
        `\nOpen the Review page (${job.table} tab) to read the results.`;
      addMessage("bot", (job.error ? "⚠️ " : "✅ ") + last + tip);
      chatHistory.push({ role: "assistant", content: `[Job finished] ${last}` });
      return;
    }
    await new Promise(r => setTimeout(r, 1500));
  }
}

// Real publish / undo needs a click on "Yes, ..."
function askToConfirm(bubble, label, path, body, cancelled) {
  const row = document.createElement("div");
  row.className = "confirm";
  const yes = document.createElement("button");
  yes.className = "primary"; yes.textContent = label;
  const no = document.createElement("button");
  no.textContent = "Cancel";
  row.append(yes, no);
  bubble.append(row);

  no.onclick = () => { row.remove(); addMessage("bot", cancelled); chatHistory.push({ role: "assistant", content: cancelled }); };
  yes.onclick = async () => {
    row.remove();
    setBusy(true);
    try { await post(path, body); await watchJob(); }
    catch (e) { addMessage("error", e.message); }
    setBusy(false);
  };
}

function askToConfirmPush(bubble, table) {
  askToConfirm(bubble, `Yes, publish approved ${table} to Shopify`, `/api/${table}/push`,
               { dry_run: false }, "OK, nothing was published.");
}

// Version 3: undo puts the backed-up original text back on Shopify
function askToConfirmUndo(bubble, { table, titles }) {
  const what = titles === "all" ? `all published ${table}` : titles.join(", ");
  askToConfirm(bubble, `Yes, undo ${what}`, `/api/${table}/undo`, { titles }, "OK, nothing was undone.");
}

async function send(text) {
  text = text.trim();
  if (!text || busy) return;
  addMessage("user", text);
  chatHistory.push({ role: "user", content: text });
  $("#input").value = "";
  setBusy(true);
  const typing = addMessage("bot typing", "Thinking…");
  try {
    const data = await post("/api/chat", { messages: chatHistory.slice(-12) });
    typing.remove();
    const bubble = addMessage("bot", data.reply || "(no reply)");
    chatHistory.push({ role: "assistant", content: data.reply || "" });
    if (data.confirm_push) askToConfirmPush(bubble, data.confirm_push);
    if (data.confirm_undo) askToConfirmUndo(bubble, data.confirm_undo);
    if (data.job_started) await watchJob();
  } catch (e) {
    typing.remove();
    addMessage("error", "Sorry, something went wrong: " + e.message);
  }
  setBusy(false);
  $("#input").focus();
}

$("#form").addEventListener("submit", e => { e.preventDefault(); send($("#input").value); });
$("#input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send($("#input").value); }
});
// Visitors get question-only suggestions (the demo chat can't change anything)
const VISITOR_CHIPS = [
  "What does this tool do?",
  "What is a meta description?",
  "What did the guess checker find?",
  "Show me the new alt text for The Complete Snowboard",
  "What does the SEO audit check?",
  "Is it safe for my store?",
  "How can I use this for my own store?",
];

window.mePromise.then(me => {
  if (me.owner) return;
  document.querySelector(".welcome p").textContent =
    "Ask me about SEO, about this tool, or about the demo results from our test store.";
  const chips = $("#chips");
  chips.replaceChildren(...VISITOR_CHIPS.map(text => {
    const b = document.createElement("button");
    b.textContent = text;
    return b;
  }));
  const note = document.createElement("p");
  note.className = "demo-note";
  note.textContent = me.can_view
    ? "👀 Demo mode: ask anything about SEO, this tool or the demo results (10 messages per hour). Generating and publishing are for the owner only."
    : "Please log in to use the chat.";
  document.querySelector(".welcome").append(note);
  if (!me.can_view) { $("#input").disabled = true; setBusy(true); }
}).finally(() => {
  document.querySelectorAll("#chips button").forEach(btn => btn.addEventListener("click", () => send(btn.textContent)));
});
</script>
</body>
</html>
